<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcade Remaster</title>
  <meta name="description" content="Original arcade ROMs running cycle-accurate under a 2.5D remastered renderer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true"><path d="M3 17h18M5 17l2-6h10l2 6M8 11V7h8v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Arcade <strong>Remaster</strong></span>
    </div>
    <nav class="game-tabs" id="gameTabs" aria-label="Game"></nav>
    <div class="segmented" id="viewMode" role="radiogroup" aria-label="View">
      <button data-mode="remaster" class="active" title="2.5D remastered view (V)">Remastered</button>
      <button data-mode="classic" title="Original pixels (V)">Classic</button>
      <button data-mode="split" title="Side by side (V)">Split</button>
    </div>
    <div class="actions">
      <button class="btn" id="btnCoin" title="Insert coin (5)">Coin</button>
      <button class="btn" id="btnStart" title="Start 1 player (1)">Start</button>
      <button class="icon-btn" id="btnPause" title="Pause (P)" aria-label="Pause">
        <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btnMute" title="Mute (M)" aria-label="Mute">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btnHelp" title="Controls (H)" aria-label="Controls">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5v.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btnFull" title="Fullscreen (F)" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="view view-remaster" id="viewRemaster"></div>
    <div class="view view-classic" id="viewClassic">
      <canvas id="classicCanvas"></canvas>
      <div class="scanlines"></div>
    </div>
    <div class="splash" id="splash">
      <div class="splash-card">
        <h1>Arcade Remaster</h1>
        <p>The original arcade program runs on an emulated CPU, so the gameplay matches the arcade exactly. The remastered renderer then redraws every frame as a 2.5D scene.</p>
        <button class="btn btn-primary btn-lg" id="btnPlay">Play</button>
        <p class="hint">Arrows to move &middot; Space to jump &middot; 5 for coin &middot; 1 to start</p>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <span id="statusGame">No game loaded</span>
    <span class="sep"></span>
    <span id="statusInfo"></span>
    <span class="grow"></span>
    <span id="statusFps" class="mono"></span>
  </footer>

  <div class="modal-root" id="modalRoot" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
